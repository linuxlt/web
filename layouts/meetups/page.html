{{ define "main" }}
<div class="meetup-post">
  <article class="post">
    <header class="post-header">
      <a href="/meetups.html" class="back-link">&larr; Grįžti į susitikimus</a>
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="post-meta">
        <time class="post-date">{{ partial "lt-date.html" (dict "date" .Date "time" true) }}</time>
        {{- with .Params.location }}
        <span class="post-location">{{ . }}</span>
        {{- end }}
        {{- with .Params.author }}
        <span class="post-author">{{ partial "author-link.html" . }}</span>
        {{- end }}
      </div>
    </header>

    <div class="post-content markdown-content">
      <div class="markdown-body">
        {{ .Content }}
      </div>
    </div>

    <footer class="post-footer">
      <a href="/meetups.html" class="btn btn-outline">&larr; Visi susitikimai</a>
    </footer>
  </article>
</div>
{{ end }}
